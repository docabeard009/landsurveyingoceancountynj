<meta name="description" content="Order a survey for an Ocean County listing or closing. Elevation certificate, boundary, or title survey.">
<link rel="canonical" href="https://landsurveyingoceancountynj.com/for-realtors.html">
<style>body{margin:0;background:#f4f7f9;color:#13293a;font-family:Georgia,serif}header{background:#0B2A45;color:#fff;border-bottom:3px solid #E2731B}.bar{max-width:760px;margin:0 auto;padding:18px 22px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.12em;font-weight:700;font-size:13px}.bar span{color:#E2731B}main{max-width:760px;margin:0 auto;padding:32px 22px 64px}</style>

<header><div class="bar">LAKELAND <span>SURVEYING</span></div></header>
<main>
<h1>For realtors</h1>
<p>A listing on the barrier island usually needs one of three things: an elevation certificate for flood insurance, a boundary survey before a fence or a dock, or a title survey for the closing. Send the address, the town, and the contract date.</p>
<form action="https://formspree.io/f/xnjywovb" method="POST" style="display:grid;gap:10px;max-width:560px;background:#fff;border:1px solid #e4ebf0;border-radius:8px;padding:16px;margin:16px 0;color:#13293a;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-weight:600">
  <input type="hidden" name="_subject" value="Realtor survey request">
  <input type="text" name="_gotcha" style="display:none">
  <label>Brokerage<input name="firm" required style="width:100%;padding:10px;color:#13293a;background:#fff;border:1px solid #8aa0b0;font-size:16px"></label>
  <label>Your name<input name="name" required style="width:100%;padding:10px;color:#13293a;background:#fff;border:1px solid #8aa0b0;font-size:16px"></label>
  <label>Phone<input name="phone" type="tel" required style="width:100%;padding:10px;color:#13293a;background:#fff;border:1px solid #8aa0b0;font-size:16px"></label>
  <label>Email<input name="email" type="email" required style="width:100%;padding:10px;color:#13293a;background:#fff;border:1px solid #8aa0b0;font-size:16px"></label>
  <label>Property address<input name="address" required style="width:100%;padding:10px;color:#13293a;background:#fff;border:1px solid #8aa0b0;font-size:16px"></label>
  <label>Town<input name="town" required style="width:100%;padding:10px;color:#13293a;background:#fff;border:1px solid #8aa0b0;font-size:16px"></label>
  <label>Needed for<input name="reason" placeholder="listing, closing, flood insurance" style="width:100%;padding:10px;color:#13293a;background:#fff;border:1px solid #8aa0b0;font-size:16px"></label>
  <button type="submit" style="background:#0B2A45;color:#fff;border:0;border-radius:6px;padding:12px;font-weight:700">Request a quote</button>
</form>
<p>Or call 917.463.6042.</p>
</main>
</body>
